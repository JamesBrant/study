</style></head><body><header><div class="logo">&lt;/&gt;</div><strong>前端研习室</strong><span>从基础到资深 · 学习手册</span></header><div class="layout"><aside><input id="search" placeholder="搜索技术或知识点" aria-label="搜索课程"><nav id="nav"></nav></aside><main><div id="content"></div><div class="footer">前端研习室 · 从理解原理到解决真实问题</div></main></div><script>
const lessons=[
{group:'WEB 基础',title:'HTML 与语义化',desc:'用正确的结构描述内容，让浏览器、搜索引擎和辅助技术都能理解页面。',body:`<h2>HTML 是什么</h2><p>HTML 用元素组织内容。浏览器解析标签形成 DOM 树，CSS 决定外观，JavaScript 处理交互。优先选择能表达含义的元素，而不是用大量 div 模拟。</p><pre><code>&lt;main&gt;
  &lt;h1&gt;课程目录&lt;/h1&gt;
  &lt;nav aria-label="课程导航"&gt;
    &lt;a href="#css"&gt;学习 CSS&lt;/a&gt;
  &lt;/nav&gt;
  &lt;button type="button"&gt;开始学习&lt;/button&gt;
&lt;/main&gt;</code></pre><h2>使用要点</h2><ul><li>使用标题形成清晰层级；导航使用 nav，主要内容使用 main。</li><li>跳转用 a，触发操作用 button；原生控件自带键盘行为。</li><li>图片提供有意义的 alt；表单控件通过 label 关联名称。</li></ul><div class="note">练习：只用键盘操作页面，确认焦点可见、顺序合理，所有按钮都能使用。</div>`},
{group:'WEB 基础',title:'CSS 与布局',desc:'理解盒模型、层叠和现代布局，构建可靠的响应式界面。',body:`<h2>盒模型与层叠</h2><p>元素占据的空间由内容、内边距、边框和外边距构成。设置 border-box 后，指定的宽度包含内边距和边框。样式冲突时，浏览器结合来源、重要性、选择器优先级与声明顺序决定结果。</p><pre><code>* { box-sizing: border-box; }
.layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; }
@media (max-width: 700px) {
  .layout { grid-template-columns: 1fr; }
}</code></pre><h2>如何选择布局</h2><ul><li>Flex 适合单行或单列排列，Grid 适合二维布局。</li><li>用相对单位、弹性容器和媒体查询适配不同屏幕，避免依赖固定宽度。</li><li>定位元素前先检查包含块；z-index 受层叠上下文约束。</li></ul><div class="note">练习：实现桌面侧栏、手机单列的文章布局，并检查长文本是否溢出。</div>`},
{group:'WEB 基础',title:'JavaScript 核心',desc:'掌握作用域、闭包、对象和异步，理解代码为什么这样执行。',body:`<h2>作用域与闭包</h2><p>函数可以访问定义时所在的词法作用域。即使外层函数已经返回，内部函数仍可访问其变量，这就是闭包。它常用于封装状态，也要注意避免长期持有不需要的大对象。</p><pre><code>function createCounter() {
  let count = 0;
  return () =&gt; ++count;
}
const next = createCounter();
console.log(next(), next()); // 1 2</code></pre><h2>异步与事件循环</h2><p>同步代码先执行；Promise 回调进入微任务队列，定时器回调是任务。当前任务结束后会先清空微任务，再处理后续任务。实际执行时机还受浏览器调度影响。</p><pre><code>console.log('A');
setTimeout(() =&gt; console.log('B'), 0);
Promise.resolve().then(() =&gt; console.log('C'));
// A → C → B</code></pre><p>还应理解 this 的调用方式、原型链、ES 模块、异常处理，以及引用类型的共享和复制。</p>`},
{group:'WEB 基础',title:'TypeScript',desc:'用类型表达约束，及早发现错误，并让协作接口更清晰。',body:`<h2>类型与收窄</h2><p>TypeScript 在编译阶段检查类型，最终输出 JavaScript；类型本身不会在运行时验证外部数据。联合类型表示多种可能，通过判断可以收窄到具体类型。</p><pre><code>type Result = { ok: true; data: string } | { ok: false; error: string };
function show(result: Result) {
  return result.ok ? result.data : result.error;
}
function first&lt;T&gt;(items: T[]): T | undefined {
  return items[0];
}</code></pre><p>泛型用于保留输入和输出之间的关系。优先使用明确的类型与 unknown，避免用 any 绕过检查；接口数据仍需运行时校验。</p><div class="note">练习：为接口响应定义成功和失败类型，并处理空数据和网络错误。</div>`},
{group:'浏览器与网络',title:'浏览器运行原理',desc:'从请求到渲染，建立排查页面问题的完整路径。',body:`<h2>页面如何显示</h2><p>浏览器获取 HTML 后构建 DOM，解析 CSS 形成样式信息，再计算布局、绘制并合成页面。脚本、样式和资源加载方式都会影响这一过程。</p><h2>实践中的定位</h2><ul><li>使用 Network 检查请求耗时、状态码和缓存；使用 Performance 查看长任务与渲染开销。</li><li>几何尺寸变化可能触发布局；颜色变化通常只需重新绘制。批量读写布局，减少交替读取和修改。</li><li>用 Memory 工具排查未清理的事件监听器、定时器和被长期引用的对象。</li></ul><div class="note">练习：录制一次卡顿操作，找到耗时最长的任务，再对比优化前后的记录。</div>`},
{group:'浏览器与网络',title:'HTTP 与网络',desc:'理解请求、缓存、跨域与认证，能够定位前后端通信问题。',body:`<h2>请求与响应</h2><p>HTTP 请求包含方法、路径、请求头和可选的请求体；响应包含状态码、响应头和内容。GET 通常用于读取，POST 常用于提交；要依据接口契约处理错误和重试。</p><pre><code>async function loadUsers() {
  const response = await fetch('/api/users');
  if (!response.ok) throw new Error('请求失败: ' + response.status);
  return response.json();
}</code></pre><h2>缓存与跨域</h2><p>Cache-Control 控制缓存策略；ETag 可用于协商缓存。同源策略限制跨源读取，CORS 需要服务端返回允许的响应头，复杂请求可能先发送预检请求。Cookie 的安全属性和跨站行为也需要服务端配合配置。</p>`},
{group:'框架与工程',title:'React 与 Vue',desc:'掌握组件、状态与数据流，再理解框架的更新机制。',body:`<h2>组件与状态</h2><p>组件将界面和行为封装成可复用单元。状态变化驱动视图更新；共享状态应放在合适的共同层级。保持单向数据流，让数据来源和修改路径可追踪。</p><pre><code>// React：状态更新后重新渲染
function Counter() {
  const [count, setCount] = React.useState(0);
  return &lt;button onClick={() =&gt; setCount(n =&gt; n + 1)}&gt;
    {count}
  &lt;/button&gt;;
}</code></pre><h2>进阶重点</h2><ul><li>理解 React 的渲染与副作用清理，或 Vue 的响应式追踪与组件生命周期。</li><li>区分本地状态、跨组件状态和服务端数据；不要把所有数据放入全局状态。</li><li>理解 CSR、SSR 和静态生成的取舍：首屏、SEO、服务器成本与复杂度。</li></ul>`},
{group:'框架与工程',title:'工程化与构建',desc:'把代码可靠地转换、检查、构建和交付。',body:`<h2>构建工具做什么</h2><p>构建工具处理模块依赖、资源转换和打包。开发服务器提供快速反馈；生产构建通常包含压缩、按需拆分和资源指纹。Vite 和 Webpack 的配置方式不同，但都需要理解依赖图和构建产物。</p><h2>团队交付流程</h2><ol><li>使用包管理器锁定依赖版本，提交锁文件。</li><li>通过格式化、静态检查和代码评审维护一致性。</li><li>在 CI 中安装依赖、运行测试并构建；部署后监测，出现问题时回滚。</li></ol><div class="note">练习：分析构建产物，找出最大的依赖，评估是否可以按路由延迟加载。</div>`},
{group:'框架与工程',title:'测试与质量',desc:'用合适层级的测试保护关键行为，而不是只追求覆盖率。',body:`<h2>测试层级</h2><p>单元测试验证独立逻辑；组件测试关注用户可见行为；端到端测试覆盖关键业务流程。越接近真实环境通常越能发现集成问题，但运行和维护成本也更高。</p><pre><code>// 伪代码：验证行为和边界
expect(formatPrice(12)).toBe('¥12.00');
expect(formatPrice(0)).toBe('¥0.00');</code></pre><p>优先覆盖支付、权限、表单等高风险路径，以及错误、空状态和边界条件。避免过度依赖内部实现，使重构不会无故破坏测试。</p>`},
{group:'资深进阶',title:'性能优化',desc:'先测量，再定位瓶颈，最后用数据验证优化是否有效。',body:`<h2>关注用户体验</h2><p>LCP 关注主要内容加载速度，INP 关注交互响应，CLS 关注意外布局偏移。实验室测试有助于复现，真实用户数据更能反映设备和网络差异。</p><h2>常见优化</h2><ul><li>压缩和合理选择图片格式，延迟加载非首屏资源，为图片预留尺寸。</li><li>减少首屏 JavaScript，按需加载，避免长任务阻塞主线程。</li><li>对于大量数据，考虑分页或虚拟列表；先用性能工具确认瓶颈。</li></ul><div class="note">实践：记录优化前后的指标和测试条件，确认改善没有损害功能或可访问性。</div>`},
{group:'资深进阶',title:'前端安全',desc:'理解常见攻击路径，与服务端共同建立防护。',body:`<h2>XSS 与 CSRF</h2><p>XSS 是攻击者让恶意脚本在页面执行。优先使用框架默认的文本转义，谨慎处理不可信 HTML，配合内容安全策略。CSRF 利用用户已有的登录状态发起非预期请求，可结合 SameSite Cookie、CSRF token 和服务端来源校验防护。</p><h2>认证与授权</h2><p>前端隐藏按钮只是界面控制，真正的权限检查必须在服务端执行。敏感信息不应写入前端代码；使用 HTTPS 并妥善设置 Cookie 的 Secure 和 HttpOnly 属性。</p>`},
{group:'资深进阶',title:'架构与线上排障',desc:'围绕业务复杂度设计系统，并对交付后的运行结果负责。',body:`<h2>设计与取舍</h2><p>先明确业务目标、约束和团队规模，再划分模块与职责。组件库应沉淀稳定的共性；避免过早抽象。评估方案时比较维护成本、性能、迁移风险和团队熟悉度。</p><h2>线上问题处理</h2><ol><li>确认影响范围，必要时先回滚或降级。</li><li>通过错误监控、日志、网络请求和版本信息缩小范围，尽量复现。</li><li>修复后验证关键路径，补充针对性测试，复盘根因和预防措施。</li></ol><div class="note">资深能力的体现：能说清问题、方案取舍、协作过程和可衡量的结果。</div>`}
];
const extra = [
`<h2>从一个表单开始</h2><p>表单把用户输入交给浏览器处理。<code>label</code> 的 for 对应输入框的 id，点击文字也能聚焦输入框；required 表示提交前必须填写。</p><pre><code>&lt;form action="/search" method="get"&gt;
  &lt;label for="keyword"&gt;搜索课程&lt;/label&gt;
  &lt;input id="keyword" name="q" required&gt;
  &lt;button type="submit"&gt;搜索&lt;/button&gt;
&lt;/form&gt;</code></pre><p>输入「CSS」后提交，浏览器会请求 <code>/search?q=CSS</code>。这个地址需要服务端实现，HTML 本身不会自动搜索课程。</p><p><strong>常见错误：</strong>用 div 做按钮却没有键盘支持。优先使用 button，并为图片填写描述内容的 alt；纯装饰图片用空 alt。</p>`,
`<h2>一步步理解盒子</h2><p>假设卡片宽 200px、内边距 20px。默认 content-box 的实际宽度是 240px（不含边框）；使用 border-box 后总宽度仍为 200px。</p><pre><code>.card {
  box-sizing: border-box; /* 宽度包含内边距和边框 */
  width: 200px;
  padding: 20px;
  border: 1px solid #ddd;
}
.row { display: flex; gap: 12px; }
.row > * { flex: 1; min-width: 0; }</code></pre><p>Flex 中，容器负责排列子元素；<code>gap</code> 设置间距，<code>flex: 1</code> 让子元素分配剩余空间。使用开发者工具的布局面板可以直观看到盒子尺寸。</p><div class="note">练习：创建两张并排卡片，再用媒体查询让窄屏时纵向排列。</div>`,
`<h2>变量、函数与数组</h2><p>变量保存数据；函数把一段操作命名；数组保存多个值。先理解输入与输出，再组合出复杂逻辑。</p><pre><code>const scores = [80, 90, 100];
function average(list) {
  let total = 0;
  for (const score of list) total += score;
  return list.length ? total / list.length : 0;
}
console.log(average(scores)); // 90</code></pre><h2>异步请求如何处理错误</h2><pre><code>async function getData() {
  try {
    const response = await fetch('/api/data');
    if (!response.ok) throw new Error('请求失败');
    return await response.json();
  } catch (error) {
    console.error(error);
    return null; // 调用方需要处理空结果
  }
}</code></pre><p>await 等待 Promise 的结果；网络失败或主动抛出的错误会进入 catch。接口地址只是示例，需要真实服务支持。</p>`,
`<h2>为对象和函数标注类型</h2><pre><code>type User = { name: string; age?: number };
function greet(user: User): string {
  return '你好，' + user.name;
}
greet({ name: '小明' }); // 正确，age 可省略
// greet({ name: 123 }); // 类型错误</code></pre><p>问号表示属性可缺省。类型检查帮助开发阶段发现传错参数，但不会自动检查接口返回值。处理外部数据时先检查类型，再使用。</p><pre><code>function readName(value: unknown): string {
  if (typeof value === 'string') return value;
  return '未知';
}</code></pre><div class="note">练习：给商品定义名称和价格类型，写一个返回商品描述的函数。</div>`,
`<h2>用开发者工具观察</h2><ol><li>打开页面，按 F12 或右键选择“检查”。</li><li>在 Network 面板刷新页面，点击请求查看状态码和耗时。</li><li>在 Elements 面板选择元素，查看计算后的样式和盒模型。</li><li>在 Performance 面板录制卡顿过程，找到耗时较长的任务。</li></ol><p>例如页面点击后停顿，先录制点击过程；如果主线程中一段 JavaScript 占用很久，再分析这段代码。不要在没有测量时猜测瓶颈。</p><pre><code>// 批量读取，再批量写入，避免反复交替
const heights = items.map(item =&gt; item.offsetHeight);
items.forEach((item, i) =&gt; {
  item.style.height = heights[i] + 10 + 'px';
});</code></pre>`,
`<h2>看懂一个请求</h2><pre><code>GET /api/users HTTP/1.1
Accept: application/json

HTTP/1.1 200 OK
Content-Type: application/json

[{"name":"小明"}]</code></pre><p>第一行说明方法和路径；响应中的 200 表示请求成功，JSON 是返回的数据。常见状态码还有 404（资源不存在）和 500（服务端错误）。</p><h2>跨域示例</h2><p>从 <code>https://a.example</code> 访问 <code>https://b.example</code> 属于跨源。浏览器是否允许页面读取响应，由服务端的 CORS 响应头等规则决定；仅在前端修改请求通常无法解决服务端未授权的问题。</p><div class="note">练习：在 Network 中查看一个请求的方法、状态码、响应和缓存头。</div>`,
`<h2>用 Vue 实现同一个计数器</h2><pre><code>&lt;script setup&gt;
import { ref } from 'vue';
const count = ref(0); // 可响应的状态
&lt;/script&gt;
&lt;template&gt;
  &lt;button @click="count++"&gt;{{ count }}&lt;/button&gt;
&lt;/template&gt;</code></pre><p>点击按钮改变 count，Vue 更新依赖它的视图。React 示例通过 setCount 更新状态；两者都不应直接手工修改框架管理的 DOM。</p><h2>如何划分组件</h2><p>例如课程页面可以拆成搜索框、目录和文章。把选中的课程放在它们共同的父组件，由父组件传递数据和操作，避免各组件维护互相矛盾的副本。</p>`,
`<h2>一次构建的基本过程</h2><ol><li>从入口文件出发，查找 import 形成依赖关系。</li><li>转换 TypeScript、处理 CSS 和图片等资源。</li><li>生成浏览器可使用的文件，按配置拆分和压缩。</li><li>将构建目录部署到服务器，并检查资源路径。</li></ol><pre><code>npm install        # 根据项目依赖安装
npm run build      # 执行 package.json 中的 build 脚本</code></pre><p>命令是否可用取决于项目配置。CI 可以在每次提交后自动安装、测试和构建，让问题更早暴露。部署前要确认环境变量和静态资源的基础路径。</p>`,
`<h2>一个可运行的测试思路</h2><pre><code>// 使用 Vitest；需要先安装并配置项目
import { describe, it, expect } from 'vitest';
function add(a, b) { return a + b; }
describe('add', () =&gt; {
  it('能计算两个数的和', () =&gt; {
    expect(add(2, 3)).toBe(5);
  });
});</code></pre><p>测试分为准备、执行和断言：提供输入，调用功能，再检查结果。除了正常值，还应测试空值、错误和边界。组件测试尽量模拟点击和输入，验证用户看到的结果。</p><div class="note">练习：为登录表单写测试，检查空密码时是否显示提示。</div>`,
`<h2>从一个具体问题入手</h2><p>如果首屏很慢，先在 Network 查看大文件和请求顺序，再在 Performance 中观察脚本是否阻塞主线程。根据证据选择优化，并在相同条件下比较结果。</p><pre><code>&lt;!-- 为图片预留空间，减少布局跳动 --&gt;
&lt;img src="course.jpg" alt="课程封面"
     width="800" height="450" loading="lazy"&gt;</code></pre><p>这个 lazy 示例适合非首屏图片；首屏关键图片通常不应盲目延迟加载。拆包同样有成本，只有在实际减少关键路径负担时才有价值。</p><div class="note">练习：用 Lighthouse 或性能面板测量一个页面，记录优化前后的结果和网络条件。</div>`,
`<h2>安全地展示用户输入</h2><pre><code>const name = '&lt;img src=x onerror=alert(1)&gt;';
const element = document.querySelector('#name');
element.textContent = name; // 当作文本显示
// 不要把不可信内容直接赋给 innerHTML</code></pre><p>textContent 不会把输入解析成 HTML。如果业务确实需要富文本，应使用可靠的净化方案，并在服务端配合校验。内容安全策略是额外防线，不能替代安全编码。</p><p><strong>权限示例：</strong>前端可以隐藏“删除”按钮，但攻击者仍可直接请求接口；服务端必须检查用户是否有删除权限。</p>`,
`<h2>用一个案例串起来</h2><p>假设课程列表打开缓慢：先确认影响范围和发布时间，再查看监控与 Network；如果发现接口耗时正常而渲染长任务明显，就进一步检查列表渲染。</p><ol><li>记录基线：数据量、设备、耗时和复现步骤。</li><li>评估分页或虚拟列表，比较体验、实现成本和维护难度。</li><li>上线后观察真实指标与错误率，准备回滚方式。</li><li>记录结论，让团队下次能更快解决类似问题。</li></ol><p>架构设计也遵循这个思路：从需求和约束出发，先选择足够简单的方案，再根据真实问题调整。</p>`
];
lessons.forEach((lesson, i) => { lesson.body += extra[i]; });

{group:'框架与工程',title:'Vue 2',desc:'从选项式 API 入手，掌握 Vue 2 项目中常见的组件、数据和响应式机制。',body:`<div class="note">Vue 2 已于 2023 年 12 月 31 日结束官方维护。本章适合维护已有项目；新项目通常选择 Vue 3。<a href="https://v2.vuejs.org/eol/">查看官方说明</a></div>
<h2>1. Vue 是什么</h2><p>Vue 把数据和界面联系起来：数据变化后，框架更新页面。一个组件通常由模板、逻辑和样式组成。以下示例使用单文件组件（.vue），需要 Vue 2 项目的构建环境。</p>
<h2>2. 数据、事件和计算属性</h2><pre><code>&lt;template&gt;
  &lt;div&gt;
    &lt;p&gt;{{ message }}，点击了 {{ count }} 次&lt;/p&gt;
    &lt;button @click="increment"&gt;增加&lt;/button&gt;
    &lt;p&gt;双倍：{{ doubled }}&lt;/p&gt;
    &lt;input v-model="message" placeholder="输入文字"&gt;
  &lt;/div&gt;
&lt;/template&gt;
&lt;script&gt;
export default {
  data() { return { message: '你好', count: 0 }; },
  computed: {
    doubled() { return this.count * 2; }
  },
  methods: {
    increment() { this.count++; }
  }
};
&lt;/script&gt;</code></pre><p><code>data</code> 返回组件自己的数据；<code>{{ }}</code> 展示数据；<code>@click</code> 监听点击；<code>v-model</code> 同步输入框与数据。计算属性用于根据已有状态得到新值，并按响应式依赖缓存。methods 中使用普通函数，才能通过 this 访问组件实例。</p>
<h2>3. 条件与列表</h2><pre><code>&lt;p v-if="items.length === 0"&gt;暂无课程&lt;/p&gt;
&lt;ul v-else&gt;
  &lt;li v-for="item in items" :key="item.id"&gt;
    {{ item.name }}
  &lt;/li&gt;
&lt;/ul&gt;</code></pre><p>这里假设 data 中声明了 items 数组。v-if 控制元素是否创建；v-for 遍历数组，key 应使用稳定且唯一的标识。v-show 则通过 CSS 控制显示，元素仍然存在。</p>
<h2>4. 父子组件通信</h2><pre><code>&lt;!-- 父组件模板，假设已注册 CourseCard --&gt;
&lt;CourseCard :title="courseName" @choose="onChoose" /&gt;

// 子组件的选项
export default {
  props: { title: String },
  methods: {
    choose() { this.$emit('choose', this.title); }
  }
};</code></pre><p>父组件通过 prop 传入数据，子组件通过 emit 通知父组件；子组件应避免直接修改 prop。子组件模板可用 <code>&lt;button @click="choose"&gt;{{ title }}&lt;/button&gt;</code> 触发事件，父组件需定义 courseName 和 onChoose。</p>
<h2>5. 生命周期和响应式注意事项</h2><p>created 时实例已建立，可准备数据；mounted 时组件已挂载，可访问 DOM；beforeDestroy 中适合清理定时器和手动添加的监听器。Vue 2 的数据监听基于 getter/setter，无法直接检测某些新增属性和数组下标修改。</p><pre><code>// user 和 items 已在 data 中声明
this.$set(this.user, 'age', 18); // 给嵌套对象新增响应式属性
this.$set(this.items, 0, { id: 1, name: 'HTML' });
// 或者用 this.items.splice(0, 1, newItem)</code></pre><p>根级响应式字段应预先在 data 中声明。数据更新后 DOM 通常异步更新，需要读取更新后的 DOM 时可使用 <code>this.$nextTick()</code>。</p><div class="note">练习：做一个课程列表，支持输入课程名、点击添加和显示课程数量。参考 <a href="https://v2.vuejs.org/v2/guide/">Vue 2 官方指南</a>。</div>`},
{group:'框架与工程',title:'Vue 3',desc:'学习组合式 API、响应式数据、组件通信和项目开发中的常见用法。',body:`<h2>1. Vue 3 与组件</h2><p>Vue 3 支持选项式 API 和组合式 API。本章使用单文件组件的 <code>script setup</code>，需要 Vue 3 项目的构建环境。模板负责界面，脚本负责数据与行为，样式负责外观。</p>
<h2>2. ref、事件和计算属性</h2><pre><code>&lt;script setup&gt;
import { ref, computed } from 'vue';
const message = ref('你好');
const count = ref(0);
const doubled = computed(() =&gt; count.value * 2);
function increment() {
  count.value++; // 在 JavaScript 中使用 .value
}
&lt;/script&gt;
&lt;template&gt;
  &lt;p&gt;{{ message }}，点击了 {{ count }} 次&lt;/p&gt;
  &lt;button @click="increment"&gt;增加&lt;/button&gt;
  &lt;p&gt;双倍：{{ doubled }}&lt;/p&gt;
  &lt;input v-model="message"&gt;
&lt;/template&gt;</code></pre><p>ref 创建响应式容器，在脚本中通过 .value 读写；顶层 ref 在模板中通常自动解包。computed 表示由其他状态计算出的值，不应在计算中发请求或修改其他状态。</p>
<h2>3. reactive 与 watch</h2><pre><code>import { reactive, watch } from 'vue';
const form = reactive({ name: '', age: 18 });
watch(() =&gt; form.name, (newName, oldName) =&gt; {
  console.log('名称变化', oldName, newName);
});
form.name = '小明';</code></pre><p>reactive 用于对象，返回一个响应式代理；应通过代理修改数据。watch 适合在数据变化后执行副作用，例如请求数据。直接解构 reactive 的基本类型属性会失去与原对象属性的响应式关联；需要时可用 toRefs。</p>
<h2>4. 模板与组件通信</h2><pre><code>&lt;!-- 子组件 CourseCard.vue --&gt;
&lt;script setup&gt;
const props = defineProps({ title: String });
const emit = defineEmits(['choose']);
&lt;/script&gt;
&lt;template&gt;
  &lt;button @click="emit('choose', props.title)"&gt;
    {{ props.title }}
  &lt;/button&gt;
&lt;/template&gt;

&lt;!-- 父组件已导入 CourseCard 并定义 courseName、onChoose --&gt;
&lt;CourseCard :title="courseName" @choose="onChoose" /&gt;</code></pre><p>prop 从父组件流向子组件；emit 将事件传回父组件。列表使用 <code>v-for</code> 和稳定的 key，条件显示可使用 v-if 或 v-show。组件之间共享状态时，先考虑提升到共同父组件；跨多层共享时再考虑状态管理。</p>
<h2>5. 生命周期与异步更新</h2><pre><code>import { onMounted, onUnmounted, nextTick, ref } from 'vue';
const count = ref(0);
let timer;
onMounted(() =&gt; { timer = setInterval(() =&gt; count.value++, 1000); });
onUnmounted(() =&gt; { clearInterval(timer); });
async function incrementAndRead() {
  count.value++;
  await nextTick(); // 等待 Vue 完成本轮 DOM 更新
}</code></pre><p>挂载后可访问已渲染的 DOM；组件卸载时清理定时器等资源。Vue 3 的对象响应式基于 Proxy，与 Vue 2 的 getter/setter 机制不同；Vue 3 也保留选项式 API。</p><div class="note">练习：创建可添加、删除课程的列表，用 computed 显示总数。参考 <a href="https://vuejs.org/guide/essentials/reactivity-fundamentals">Vue 3 官方指南</a>。</div>`}
);

{group:'WEB 基础',title:'JS 原型与原型链',desc:'理解对象如何共享属性和方法，以及属性查找的过程。',body:`<h2>先认识对象和属性</h2><p>对象是一组属性的集合。读取 <code>person.name</code> 时，JavaScript 会先在 person 自身查找 name；找不到时，再沿着它的原型继续查找。</p><pre><code>const person = { name: '小明' };
console.log(person.name); // 小明</code></pre><h2>什么是原型</h2><p>每个普通对象都有一个指向另一个对象或 null 的内部原型链接。可以用 <code>Object.getPrototypeOf</code> 查看。原型也是对象，因此多个对象可以通过它共享方法。</p><pre><code>const animal = {
  speak() { return '你好'; }
};
const cat = Object.create(animal);
cat.name = '小猫';
console.log(cat.name);    // 小猫：来自 cat 自身
console.log(cat.speak()); // 你好：沿原型找到 speak
console.log(Object.getPrototypeOf(cat) === animal); // true</code></pre><p>这里的查找顺序是 <code>cat → animal → Object.prototype → null</code>。找不到属性时结果为 undefined。这个查找路径就是原型链。</p><h2>构造函数与 prototype</h2><pre><code>function Person(name) {
  this.name = name; // 每个实例自己的数据
}
Person.prototype.sayHi = function () {
  return '你好，我是' + this.name;
};
const a = new Person('小明');
const b = new Person('小红');
console.log(a.sayHi()); // 你好，我是小明
console.log(a.sayHi === b.sayHi); // true，共享方法
console.log(Object.getPrototypeOf(a) === Person.prototype); // true</code></pre><p>函数的 <code>prototype</code> 属性用于作为通过 new 创建的实例的原型；对象的内部原型链接则指向其原型对象。两者相关，但不是同一个概念。调用 <code>a.sayHi()</code> 时，方法里的 this 指向 a。</p><h2>属性遮蔽</h2><pre><code>const parent = { color: '蓝色' };
const child = Object.create(parent);
child.color = '红色';
console.log(child.color); // 红色，自身属性优先
console.log(parent.color); // 蓝色，原型没有改变
delete child.color;
console.log(child.color); // 蓝色，重新从原型找到</code></pre><p><code>Object.hasOwn(child, 'color')</code> 可以判断属性是否属于对象自身。class 语法提供更方便的写法，其实例方法仍基于原型共享。</p><div class="note">练习：创建一个共享 walk 方法的原型，再创建两个对象，分别设置名字并调用 walk。</div>`},
{group:'WEB 基础',title:'浏览器事件机制',desc:'从监听点击开始，理解捕获、目标、冒泡以及事件委托。',body:`<h2>监听事件</h2><p>事件是浏览器对用户操作或其他变化的通知，例如 click、input 和 submit。使用 addEventListener 注册处理函数。</p><pre><code>&lt;button id="btn"&gt;点击我&lt;/button&gt;
&lt;script&gt;
const button = document.querySelector('#btn');
button.addEventListener('click', function (event) {
  console.log('按钮被点击', event.type);
});
&lt;/script&gt;</code></pre><p>事件对象提供相关信息，例如事件类型和触发元素。同一个元素可以注册多个监听器；不再需要时可以移除。</p><h2>事件传播的三个阶段</h2><p>点击嵌套元素时，事件通常先从文档向目标传播（捕获），到达目标，再向外传播（冒泡）。不是所有事件都冒泡。</p><pre><code>&lt;div id="outer"&gt;&lt;button id="inner"&gt;点击&lt;/button&gt;&lt;/div&gt;
&lt;script&gt;
const outer = document.querySelector('#outer');
const inner = document.querySelector('#inner');
outer.addEventListener('click', () =&gt; console.log('外层捕获'), true);
inner.addEventListener('click', () =&gt; console.log('按钮'));
outer.addEventListener('click', () =&gt; console.log('外层冒泡'));
// 点击按钮：外层捕获 → 按钮 → 外层冒泡
&lt;/script&gt;</code></pre><h2>target 和 currentTarget</h2><p><code>event.target</code> 是事件发生的目标；<code>event.currentTarget</code> 是当前执行监听器的元素。借助冒泡，可以在父元素上统一处理子元素事件，这叫事件委托。</p><pre><code>const list = document.querySelector('#list');
list.addEventListener('click', (event) =&gt; {
  const button = event.target.closest('button');
  if (!button || !list.contains(button)) return;
  console.log('选择课程：', button.textContent);
});</code></pre><p>上例需要页面中有 id 为 list、内部包含按钮的元素。即使之后添加按钮，也能由父元素处理。</p><h2>阻止默认行为与传播</h2><p><code>preventDefault()</code> 阻止可取消事件的默认行为，例如阻止表单直接提交；<code>stopPropagation()</code> 阻止事件继续传播。两者作用不同，也不会互相替代。</p><pre><code>const form = document.querySelector('form');
form.addEventListener('submit', (event) =&gt; {
  event.preventDefault(); // 不执行浏览器默认提交
  console.log('先检查表单');
});</code></pre><p>移除监听器时，需传入注册时同一个函数引用。组件销毁时清理监听器，避免重复响应或不必要的引用。</p><div class="note">练习：给列表添加三个按钮，在父元素上监听点击，输出被点击按钮的文字。</div>`}
);

  group: '框架与工程', title: 'Webpack 5', desc: '从零认识模块打包，学会配置入口、输出、Loader 和插件。', body: String.raw`
<h2>1. Webpack 是什么</h2><p>Webpack 是模块打包工具。它从入口文件开始，沿着 import 查找依赖，建立依赖图，然后生成浏览器可以加载的文件。例如，入口导入一个工具函数和一份 CSS，它们都会进入构建流程。</p>
<h2>2. 创建最小项目</h2><p>先安装 Node.js 和 npm，在空目录执行以下命令。npm init 创建项目配置；后面的命令将 Webpack 及命令行工具安装为开发依赖。</p><pre><code>npm init -y
npm install -D webpack@5 webpack-cli
mkdir src</code></pre><p>创建 <code>src/index.js</code>，输入下面的代码：</p><pre><code>const message = '你好，Webpack 5！';
document.body.textContent = message;</code></pre><p>运行 <code>npx webpack --mode production</code>，默认从 src/index.js 构建并输出 dist/main.js。可以创建 HTML 文件，通过 script 标签加载这个文件查看结果。</p>
<h2>3. 入口、输出和模式</h2><p>在项目根目录创建 <code>webpack.config.js</code>（以下采用 CommonJS，适用于没有设置 type: module 的项目）：</p><pre><code>const path = require('path');
module.exports = {
  mode: 'development',
  entry: './src/index.js',
  output: {
    path: path.resolve(__dirname, 'dist'),
    filename: 'bundle.js',
    clean: true
  }
};</code></pre><p>entry 是入口，output 指定输出目录和文件名；clean 会在输出前清理输出目录，因此不要把需要保留的文件放在 dist 中。development 便于调试；production 开启生产优化，例如压缩 JavaScript。运行 <code>npx webpack</code> 即可使用配置。</p>
<h2>4. Loader：处理 CSS</h2><p>Loader 可以转换模块内容。下面使用常见的 css-loader 和 style-loader 方案：</p><pre><code>npm install -D css-loader style-loader</code></pre><p>把以下配置加入 webpack.config.js 的 module.exports 对象：</p><pre><code>module: {
  rules: [
    { test: /\.css$/, use: ['style-loader', 'css-loader'] }
  ]
}</code></pre><p>在 src/index.js 写 <code>import './style.css';</code> 并创建同目录的 style.css。Loader 从右往左执行：css-loader 处理 CSS 中的依赖，style-loader 将样式插入页面。生产环境也可以考虑使用插件提取独立 CSS 文件。</p>
<h2>5. Plugin：生成 HTML</h2><p>插件可以参与更广泛的构建工作。例如 HtmlWebpackPlugin 生成 HTML，并自动插入构建出的脚本。</p><pre><code>npm install -D html-webpack-plugin</code></pre><p>在配置文件顶部引入，并在配置对象中添加：</p><pre><code>const HtmlWebpackPlugin = require('html-webpack-plugin');
// 在 module.exports 内：
plugins: [new HtmlWebpackPlugin({ title: '我的课程' })]</code></pre><p>重新运行构建后，可在 dist 中找到生成的 index.html 和脚本。Plugin 通常通过 new 创建实例；Loader 主要处理匹配的文件，Plugin 则可参与整个构建流程。</p>
<h2>6. 图片和资源</h2><p>Webpack 5 的 Asset Modules 可以处理图片等资源。例如在 rules 中增加：</p><pre><code>{ test: /\.(png|jpg|svg)$/i, type: 'asset/resource' }</code></pre><p>在 JavaScript 中 <code>import imageUrl from './logo.png'</code>，imageUrl 是构建后的资源地址；需要先准备对应的图片文件。asset/resource 会输出独立文件。</p>
<h2>7. 按需加载与缓存</h2><pre><code>// 用户点击按钮后才加载模块
button.addEventListener('click', async () =&gt; {
  const module = await import('./help.js');
  module.showHelp();
});</code></pre><p>这个例子假设 button 已获取，help.js 导出了 showHelp。动态 import 可以生成单独的 chunk，减少初始加载内容，但也会增加额外请求。生产环境可使用 <code>filename: '[name].[contenthash].js'</code> 帮助长期缓存；文件内容变化时哈希也会变化。</p>
<h2>8. 常见排查</h2><ul><li>找不到模块：检查文件路径、大小写及依赖是否安装。</li><li>CSS 不生效：检查是否导入 CSS，规则是否匹配，Loader 顺序是否正确。</li><li>部署后资源 404：检查输出路径、服务器目录和 publicPath，尤其是网站部署在子路径时。</li><li>构建体积过大：先分析产物，再考虑按需加载和依赖替换。</li></ul><div class="note">练习：创建入口文件、导入 CSS，用插件生成 HTML，再将一个功能改为动态导入。参考 <a href="https://webpack.js.org/concepts/">Webpack 官方概念指南</a>。</div>`

<h2>先了解名称</h2><p>HTML5 通常指现代 HTML 中的一批能力，例如语义化元素、增强的表单和多媒体。CSS3 是多个 CSS 模块的统称，现代 CSS 仍在持续发展；下面也会介绍常用的较新 CSS 能力。</p>
<h2>一、HTML5 语义化标签</h2><p>语义化是用标签表达内容的作用。例如 header 表示页头，nav 表示导航，main 表示主要内容，article 表示独立文章，footer 表示页脚。浏览器和辅助技术可以更容易理解页面结构。</p><pre><code>&lt;header&gt;&lt;h1&gt;前端学习&lt;/h1&gt;&lt;/header&gt;
&lt;nav aria-label="主导航"&gt;
  &lt;a href="#html"&gt;HTML 教程&lt;/a&gt;
&lt;/nav&gt;
&lt;main&gt;
  &lt;article id="html"&gt;
    &lt;h2&gt;认识 HTML&lt;/h2&gt;
    &lt;p&gt;HTML 用来描述页面结构。&lt;/p&gt;
  &lt;/article&gt;
&lt;/main&gt;
&lt;footer&gt;学习笔记&lt;/footer&gt;</code></pre><p>这些标签默认不负责美观，仍需 CSS 设置样式。标题按照内容层级使用，链接用于跳转，按钮用于执行操作。</p>
<h2>二、增强的表单</h2><pre><code>&lt;form action="/register" method="post"&gt;
  &lt;label for="email"&gt;邮箱&lt;/label&gt;
  &lt;input id="email" name="email" type="email" required&gt;
  &lt;label for="day"&gt;学习日期&lt;/label&gt;
  &lt;input id="day" name="day" type="date"&gt;
  &lt;label for="hours"&gt;每天学习小时数&lt;/label&gt;
  &lt;input id="hours" name="hours" type="number" min="1" max="8"&gt;
  &lt;button type="submit"&gt;提交&lt;/button&gt;
&lt;/form&gt;</code></pre><p>email 可以触发浏览器的邮箱格式检查，date 提供日期选择，number 可限制数值范围，required 表示必填。不同浏览器的控件外观可能不同。浏览器校验方便用户，但服务端仍需验证数据；示例的提交地址需要服务端实现。</p>
<h2>三、音频与视频</h2><pre><code>&lt;video controls width="480" poster="cover.jpg"&gt;
  &lt;source src="lesson.mp4" type="video/mp4"&gt;
  您的浏览器无法播放视频。
&lt;/video&gt;
&lt;audio controls src="lesson.mp3"&gt;浏览器不支持音频。&lt;/audio&gt;</code></pre><p>controls 显示播放控件，poster 是视频播放前的封面。需要提供真实媒体文件；视频应考虑字幕和不同设备的格式兼容性。不要假定浏览器允许带声音的自动播放。</p>
<h2>四、Canvas 与浏览器存储</h2><p>Canvas 是一块可用 JavaScript 绘图的区域，适合图表和简单动画：</p><pre><code>&lt;canvas id="board" width="240" height="100"&gt;您的浏览器不支持画布。&lt;/canvas&gt;
&lt;script&gt;
const ctx = document.querySelector('#board').getContext('2d');
ctx.fillStyle = '#3067e8';
ctx.fillRect(10, 10, 100, 50); // x、y、宽、高
&lt;/script&gt;</code></pre><p>localStorage 可以在同一来源下保存字符串，关闭页面后通常仍保留；用户可以清除数据，也可能因浏览器设置而无法使用。不要把密码等敏感信息存入其中。</p><pre><code>localStorage.setItem('course', 'HTML');
console.log(localStorage.getItem('course')); // HTML
localStorage.removeItem('course');</code></pre>
<h2>五、CSS 选择器和视觉效果</h2><pre><code>.card {
  border-radius: 12px; /* 圆角 */
  box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
  background: linear-gradient(135deg, #eaf2ff, #fff);
}
input:focus { outline: 2px solid #3067e8; }
li:nth-child(even) { background: #f5f7fb; }</code></pre><p>focus 选中获得焦点的元素；nth-child(even) 选中父元素下序号为偶数的子元素。保留清晰的焦点样式，方便键盘操作。</p>
<h2>六、Flex 与 Grid 布局</h2><pre><code>/* Flex：适合一行或一列 */
.toolbar { display: flex; gap: 12px; align-items: center; }
/* Grid：适合行列布局 */
.courses {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 700px) {
  .courses { grid-template-columns: 1fr; }
}</code></pre><p>把 class 为 courses 的容器放入多张卡片，宽屏时显示三列；屏幕宽度不超过 700px 时切换成一列。断点应根据内容是否拥挤来调整。</p>
<h2>七、过渡、变换和动画</h2><pre><code>.button { transition: transform .2s, background-color .2s; }
.button:hover { transform: translateY(-2px); background-color: #dce8ff; }
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
.card { animation: fade-in .4s ease; }
@media (prefers-reduced-motion: reduce) {
  .button { transition: none; }
  .card { animation: none; }
}</code></pre><p>transition 在状态变化时平滑过渡；transform 改变视觉位置；@keyframes 定义动画过程。减少动画设置尊重用户的系统偏好。</p>
<h2>八、CSS 变量</h2><pre><code>:root { --brand: #3067e8; --space: 16px; }
.card { padding: var(--space); border: 1px solid var(--brand); }
.button { color: white; background: var(--brand); }</code></pre><p>自定义属性以两个连字符开头，使用 var() 读取；修改变量可以统一调整多处样式。它们遵循层叠和继承规则。</p><div class="note">练习：制作课程卡片，使用语义化标签、Grid 布局和 CSS 变量，并让窄屏时卡片变成单列。参考 <a href="https://developer.mozilla.org/zh-CN/docs/Web/HTML">MDN HTML</a> 和 <a href="https://developer.mozilla.org/zh-CN/docs/Web/CSS">MDN CSS</a>。</div>`});
